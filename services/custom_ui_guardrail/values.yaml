services:
  - name: custom-ui-guardrail
    image:
      registry: "eu.gcr.io/igenius-registry"
      repository: custom_ui_guardrail
      tag: "latest"
      pullPolicy: Always
    imagePullSecrets:
      - name: vault-image-pull-secrets
    env:
      - name: "MODEL_NAME"
        value: "Qwen/Qwen3-32B"
      - name: "URL"
        value: "https://gateway-dev.llm.crystal.ai/v1/chat/completions"
      - name: "API_KEY"
        valueFrom:
          secretKeyRef:
            name: "credential-test-secret"
            key: "VLLM_API_KEY"
    ingress:
      enabled: true
      host: "blueprint"
      # ingressClass: "kong"
      ingressClass: "azure-application-gateway"
      annotations:
        # konghq.com/strip-path: "true"
        # konghq.com/protocols: https
        # konghq.com/https-redirect-status-code: "308"
        cert-manager.io/cluster-issuer: "letsencrypt"
        appgw.ingress.kubernetes.io/health-probe-path: /health
        appgw.ingress.kubernetes.io/ssl-redirect: "true"
      portName: http
      exposeName: "http"
      targetPort: 8080
      tls:
        enabled: true
        secretName: "tls-blueprint"
