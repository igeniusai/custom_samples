<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${title} — Check Settings</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f0f2f5;
            color: #1a2332;
            margin: 0;
            padding: 32px 16px 64px;
            font-size: 14px;
            line-height: 1.5;
        }

        body.dark {
            background: #0d1117;
            color: #e6edf3;
        }

        .page-header {
            max-width: 680px;
            margin: 0 auto 28px;
            padding-bottom: 20px;
            border-bottom: 1px solid #d5dbe4;
        }

        body.dark .page-header { border-bottom-color: #30363d; }

        .page-header h1 {
            font-size: 20px;
            font-weight: 600;
            color: #0d1b2e;
            margin: 0 0 4px;
            letter-spacing: -0.2px;
        }

        body.dark .page-header h1 { color: #e6edf3; }

        .page-header p {
            color: #5a6a7e;
            margin: 0;
            font-size: 13px;
        }

        .card {
            background: #ffffff;
            border: 1px solid #d5dbe4;
            border-radius: 6px;
            max-width: 680px;
            margin: 0 auto 20px;
            overflow: hidden;
        }

        body.dark .card { background: #161b22; border-color: #30363d; }

        .card-header {
            padding: 14px 20px;
            border-bottom: 1px solid #e8ecf0;
            background: #f8f9fb;
        }

        body.dark .card-header { background: #1c2129; border-bottom-color: #30363d; }

        .card-header h2 {
            font-size: 13px;
            font-weight: 600;
            color: #1a2332;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        body.dark .card-header h2 { color: #e6edf3; }

        .card-body { padding: 8px 20px; }

        .field {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid #eef1f5;
        }

        body.dark .field { border-bottom-color: #21262d; }

        .field:last-child { border-bottom: none; }

        .field input[type="checkbox"] {
            margin-top: 3px;
            width: 16px;
            height: 16px;
            accent-color: #1a3f6f;
            cursor: pointer;
            flex-shrink: 0;
        }

        .field label {
            display: block;
            font-size: 13.5px;
            font-weight: 600;
            color: #1a2332;
            cursor: pointer;
        }

        body.dark .field label { color: #e6edf3; }

        .field .field-desc {
            font-size: 12px;
            font-weight: 400;
            color: #7a8fa6;
            margin-top: 2px;
        }

        body.dark .field .field-desc { color: #8b949e; }

        .card-footer {
            padding: 14px 20px;
            border-top: 1px solid #e8ecf0;
            background: #f8f9fb;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        body.dark .card-footer { background: #1c2129; border-top-color: #30363d; }

        button {
            padding: 8px 22px;
            background: #1a3f6f;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            font-family: inherit;
            letter-spacing: 0.2px;
            transition: background 0.15s;
        }

        button:hover { background: #163460; }
        button:active { background: #112a4f; }

        #status { font-size: 13px; display: none; padding: 4px 0; }
        .success { color: #1a6b3c; }
        .error   { color: #9b1c1c; }
    </style>
</head>
<body>
    <div class="page-header">
        <h1>${title}</h1>
        <p>Checks applied to received events.</p>
    </div>

    <div class="card">
        <div class="card-header"><h2>Enabled Checks</h2></div>
        <div class="card-body">
            <div class="field">
                <input type="checkbox" id="check-pii" ${pii_checked}>
                <label for="check-pii">
                    PII
                    <div class="field-desc">Flags personally identifiable information in event content.</div>
                </label>
            </div>
            <div class="field">
                <input type="checkbox" id="check-toxicity" ${toxicity_checked}>
                <label for="check-toxicity">
                    Toxicity
                    <div class="field-desc">Flags profanity, hate speech, or otherwise toxic content.</div>
                </label>
            </div>
            <div class="field">
                <input type="checkbox" id="check-prompt-injection" ${prompt_injection_checked}>
                <label for="check-prompt-injection">
                    Prompt Injection
                    <div class="field-desc">Flags attempts to override or manipulate system instructions.</div>
                </label>
            </div>
        </div>
        <div class="card-footer">
            <button onclick="saveConfig()">Save configuration</button>
            <div id="status"></div>
        </div>
    </div>

    <script>
        const POST_PATH = '${post_path}';
        const statusEl = document.getElementById('status');

        const urlParams = new URLSearchParams(window.location.search);
        applyTheme(urlParams.get('theme') || 'light');

        let authorizationHeader = null;

        function applyTheme(theme) {
            document.body.classList.toggle('dark', theme === 'dark');
        }

        window.parent.postMessage({ type: 'request-params' }, '*');

        window.addEventListener('message', function(event) {
            if (!event.data || event.data.type !== 'params') return;
            if (event.data.theme) applyTheme(event.data.theme);
            if (event.data.authorization) authorizationHeader = event.data.authorization;
        });

        function buildHeaders() {
            const headers = { 'Content-Type': 'application/json' };
            if (authorizationHeader) headers['Authorization'] = authorizationHeader;
            return headers;
        }

        function showStatus(message, success) {
            statusEl.textContent = message;
            statusEl.className = success ? 'success' : 'error';
            statusEl.style.display = 'block';
        }

        async function saveConfig() {
            const body = {
                pii: document.getElementById('check-pii').checked,
                toxicity: document.getElementById('check-toxicity').checked,
                prompt_injection: document.getElementById('check-prompt-injection').checked,
            };

            try {
                const resp = await fetch(POST_PATH, {
                    method: 'POST',
                    headers: buildHeaders(),
                    body: JSON.stringify(body),
                });
                const data = await resp.json();
                if (resp.ok) {
                    showStatus('Configuration saved successfully.', true);
                } else {
                    showStatus(data.detail || 'Error saving configuration.', false);
                }
            } catch (e) {
                showStatus('Network error: ' + e.message, false);
            }
        }
    </script>
</body>
</html>
